name: Build Eden Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout (patch file)
        uses: actions/checkout@v4
        with:
          path: patchrepo

      - name: Get Eden source and apply patch
        run: |
          git clone https://git.eden-emu.dev/eden-emu/eden.git eden
          cd eden
          git checkout e9661b2a01
          git apply --check ../patchrepo/eden-leak-and-perf.patch
          git apply ../patchrepo/eden-leak-and-perf.patch
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;30.0.16248370" "cmake;3.31.6" "platforms;android-36"

      - name: Build APK (standard, Release)
        working-directory: eden
        run: .ci/android/build.sh -t standard -b Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-apk
          path: eden/artifacts/*.apk
          if-no-files-found: error
